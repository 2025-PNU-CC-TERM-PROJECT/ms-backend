spring.profiles.active=test

spring.datasource.url=jdbc:h2:mem:ms-serving-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
